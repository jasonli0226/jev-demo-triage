[project]
name = "jev-demo-triage"
version = "0.1.0"
description = "Incident-triage agent that uses Jev (TypeSafe System One) as a tool and a tool-risk gate, compared against a plain LLM loop"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4",
    "langchain-openai>=1.6",
    "langchain-typesafe[experimental]>=0.0.1a2,<0.1",
]

[project.scripts]
jev-demo-triage = "jev_demo_triage.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_demo_triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live' --cov=jev_demo_triage --cov-report=term-missing"
markers = ["live: hits real OpenRouter endpoints (needs OPENROUTER_API_KEY, costs cents)"]
filterwarnings = ["ignore::langchain_core._api.beta_decorator.LangChainBetaWarning"]
